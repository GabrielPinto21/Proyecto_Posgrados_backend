version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: posgrados-backend:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=local
      - JAVA_OPTS=-Xmx512m
    restart: on-failure
    # Mount local .env.properties into the container so Spring can import it
    volumes:
      - "./.env.properties:/app/.env.properties:ro"
